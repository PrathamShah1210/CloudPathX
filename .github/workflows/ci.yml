name: CloudPathX verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pip-audit
      - run: ruff check app tests
        working-directory: backend
      - run: mypy app/engine.py app/aws.py --ignore-missing-imports --follow-imports=silent
        working-directory: backend
      - run: pytest -q --cov=app.engine --cov-report=term-missing --cov-fail-under=85
        working-directory: backend
      - run: pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --no-banner
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup.py
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8000/api/v1/health && curl --fail http://localhost:5173
      - if: always()
        run: docker compose logs --tail=100 && docker compose down
