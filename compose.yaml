name: cloudpathx
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cloudpathx
      POSTGRES_DB: cloudpathx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cloudpathx -d cloudpathx']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://cloudpathx:${POSTGRES_PASSWORD}@db:5432/cloudpathx
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    environment: *backend-env
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: ./backend
    environment: *backend-env
    command: [python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:5173:80']
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
